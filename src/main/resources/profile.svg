<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
    <!-- Background -->
    <rect width="800" height="300" rx="20" fill="#0B090A" />
    <rect width="790" height="290" x="5" y="5" rx="15" fill="none" stroke="#8A0303" stroke-width="4" />

    <!-- Avatar Circle Mask -->
    <defs>
        <clipPath id="avatarClip">
            <circle cx="150" cy="150" r="90" />
        </clipPath>
    </defs>

    <!-- Avatar Image (Placeholder) -->
    <image x="60" y="60" width="180" height="180" clip-path="url(#avatarClip)" href="{{AVATAR}}" />

    <!-- Avatar Border -->
    <circle cx="150" cy="150" r="90" fill="none" stroke="#9A031E" stroke-width="5" />

    <!-- User Details -->
    <text x="280" y="100" fill="#FFFFFF" font-family="sans-serif" font-size="42" font-weight="bold">{{USERNAME}}</text>
    <text x="280" y="150" fill="#D90429" font-family="monospace" font-size="28" font-weight="bold">Level {{LEVEL}}</text>
    <text x="280" y="190" fill="#C9A9A6" font-family="monospace" font-size="20">{{XP_TEXT}}</text>

    <!-- XP Progress Bar Background -->
    <rect x="280" y="210" width="460" height="30" rx="15" fill="#1B0D24" />

    <!-- XP Progress Bar Fill (Calculate out of 460) -->
    <rect x="280" y="210" width="{{XP_WIDTH}}" height="30" rx="15" fill="#D90429" />
</svg>